# Prometheus Server Configuration (prometheus.yml)
# Scrapes metrics from production MLOps inference microservices

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "mlops_inference_service"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          environment: "production"
          service: "ride-duration-api"
          team: "mlops"
