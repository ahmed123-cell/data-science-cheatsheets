# NGINX Canary Release Configuration (nginx_canary.conf)
# Routes 95% of traffic to Baseline (Model A) and 5% to Canary (Model B)

events {
    worker_connections 1024;
}

http {
    # Weighted upstream group
    upstream ml_service_cluster {
        # Production Model A (Incumbent / Baseline)
        server 127.0.0.1:8001 weight=95 max_fails=3 fail_timeout=10s;

        # Canary Candidate Model B
        server 127.0.0.1:8002 weight=5 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name api.mlops.local;

        location / {
            proxy_pass http://ml_service_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Healthcheck endpoint routed only to production baseline
        location /health {
            proxy_pass http://127.0.0.1:8001/health;
        }
    }
}
