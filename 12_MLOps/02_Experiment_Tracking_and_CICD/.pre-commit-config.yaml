# Pre-Commit Hooks Configuration (.pre-commit-config.yaml)
# Enforces code standards and prevents bad commits before they leave the developer machine

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      # CRITICAL: Rejects files > 50 MB before commit, completely preventing GitHub push rejections!
      - id: check-added-large-files
        args: ['--maxkb=50000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      # High-speed linter
      - id: ruff
        args: [--fix]
      # Modern code formatter
      - id: ruff-format
